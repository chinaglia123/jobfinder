# Atualiza as vagas das empresas a cada 6 horas (o cron gratuito da Vercel, definido no nuxt.config, roda só 1x por dia).
# Configure em Settings → Secrets and variables → Actions:
#   SITE_URL     = endereço do site (ex: https://meu-jobfinder.vercel.app)
#   CRON_SECRET  = o mesmo valor definido na Vercel
name: Indexar vagas
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar a rotina do site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Defina SITE_URL e CRON_SECRET nos secrets do repositório."; exit 0; fi
          curl -fsS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/indexar"
